<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D1124241707林俊祥 - SDGs 性別平權網頁遊戲</title>
    <style>
        /* ================= 共用設定 ================= */
        body { margin: 0; font-family: "Microsoft JhengHei", sans-serif; background-color: #333; overflow: hidden; }
        .page { display: none; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        .page.active { display: block; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; color: white; font-size: 24px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; z-index: 10; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
        .modal { background: white; padding: 40px 30px; border-radius: 12px; width: 90%; max-width: 680px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
        .instruction-text { font-size: 18px; line-height: 1.8; text-align: left; color: #333; margin: 20px 0; padding: 0 15px; }
        .highlight { color: #E03E2D; font-weight: bold; }
        .btn-container { margin-top: 25px; display: flex; justify-content: center; align-items: center; }
        .action-btn { padding: 12px 35px; font-size: 20px; background: #4682B4; color: white; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .action-btn:hover { background: #5F9EA0; }

        /* ================= 第一關專屬設定 ================= */
        #page-level1 header { background-color: rgba(46, 139, 87, 0.9); }
        #l1-game-container { 
            position: relative; width: 100%; height: calc(100vh - 65px); 
            /* 使用純 CSS 漸層畫出村莊草地感背景 */
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 40%, #90EE90 40%, #228B22 100%);
        }
        .balloon { position: absolute; cursor: pointer; transition: transform 0.2s, filter 0.2s; user-select: none; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4)); }
        .balloon:hover { filter: brightness(1.2) drop-shadow(2px 4px 8px rgba(0,0,0,0.6)); transform: scale(1.1) translateY(-10px) !important; }
        .balloon img { width: 65px; height: auto; transform-origin: bottom center; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .option-btn { padding: 12px; font-size: 16px; border: 2px solid #2E8B57; background: white; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
        .option-btn:hover { background: #2E8B57; color: white; }

        /* ================= 第二關專屬設定 ================= */
        #page-level2 header { background-color: rgba(255, 105, 180, 0.9); }
        #l2-game-container { 
            position: relative; width: 100%; height: calc(100vh - 65px); 
            /* 使用純 CSS 漸層畫出遊樂園大草原感背景 */
            background: linear-gradient(to bottom, #87CEFA 0%, #FFF0F5 50%, #98FB98 50%, #3CB371 100%);
        }
        .flower { position: absolute; cursor: pointer; transition: transform 0.2s, filter 0.2s; user-select: none; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4)); }
        .flower:hover { transform: scale(1.1); filter: brightness(1.2) drop-shadow(2px 4px 8px rgba(0,0,0,0.6)); }
        .flower img { width: 70px; height: auto; }
        
        .drag-container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .drop-zones { display: flex; justify-content: space-around; gap: 20px; }
        .drop-zone { flex: 1; min-height: 150px; border: 3px dashed #ccc; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; background: #f9f9f9; transition: background 0.2s; }
        .drop-zone.dragover { background: #e0f7fa; border-color: #00bcd4; }
        .drop-zone-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; color: #333; }
        #zone-equal .drop-zone-title { color: #2E8B57; }
        #zone-unequal .drop-zone-title { color: #DC143C; }
        .items-pool { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; min-height: 60px; padding: 15px; background: #eee; border-radius: 8px; }
        .drag-item { padding: 12px 20px; background: #FFD700; border: 2px solid #DAA520; border-radius: 8px; cursor: grab; font-weight: bold; user-select: none; box-shadow: 0 3px 5px rgba(0,0,0,0.1); font-size: 16px; }
        .drag-item:active { cursor: grabbing; }
        .drag-item.correct { background: #90EE90; border-color: #32CD32; pointer-events: none; }
        .drag-item.wrong { background: #FFB6C1; border-color: #FF69B4; pointer-events: none; }

        .cert-btn-wrapper { background: white; padding: 15px; border-radius: 12px; display: inline-block; box-shadow: 0 0 15px rgba(0,0,0,0.2); border: 2px solid #ddd; }
        .cert-btn { padding: 15px 40px; font-size: 24px; background-color: rgba(255, 105, 180, 0.9); color: white; border: 4px solid white; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.2s, filter 0.2s; }
        .cert-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* ================= 第三關 (證書頁) 專屬設定 ================= */
        #page-cert { background-color: #f4f4f9; display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: auto; }
        #page-cert.active { display: flex; }
        .certificate-wrapper { background-color: #fff; padding: 20px; border: 10px solid #DAA520; border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); width: 800px; max-width: 90%; text-align: center; position: relative; margin: 20px 0;}
        .certificate-inner { border: 4px double #DAA520; padding: 50px 40px; border-radius: 4px; }
        .cert-title { font-size: 42px; color: #D2691E; margin-bottom: 30px; font-weight: bold; letter-spacing: 2px; }
        .cert-subtitle { font-size: 24px; color: #555; margin-bottom: 40px; }
        .name-section { font-size: 28px; margin-bottom: 40px; color: #333; }
        .name-input { font-size: 28px; padding: 5px 10px; border: none; border-bottom: 2px solid #333; text-align: center; width: 250px; font-family: "Microsoft JhengHei", sans-serif; background: transparent; color: #2E8B57; font-weight: bold; }
        .name-input:focus { outline: none; border-bottom-color: #DAA520; }
        .print-name { display: none; font-size: 32px; font-weight: bold; color: #2E8B57; text-decoration: underline; padding: 0 20px; }
        .cert-content { font-size: 22px; line-height: 1.8; color: #444; margin-bottom: 60px; }
        .cert-footer { text-align: right; font-size: 20px; color: #333; font-weight: bold; margin-top: 40px; }
        .print-btn { margin-bottom: 30px; padding: 15px 40px; font-size: 22px; background-color: #4682B4; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: background 0.2s, transform 0.2s; }
        .print-btn:hover { background-color: #5F9EA0; transform: scale(1.05); }

        /* 列印模式設定 */
        @media print {
            @page { size: landscape; margin: 0; }
            body, html { background-color: white; }
            #page-level1, #page-level2 { display: none !important; }
            #page-cert { display: flex !important; height: 100vh; overflow: visible; }
            .certificate-wrapper { box-shadow: none; width: 90%; margin
